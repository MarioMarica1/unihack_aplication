[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/municipal-reports"
  to = "/.netlify/functions/municipal-reports"
  status = 200

[[redirects]]
  from = "/api/municipal-report-detail"
  to = "/.netlify/functions/municipal-report-detail"
  status = 200

[[redirects]]
  from = "/api/stpt-vehicles"
  to = "/.netlify/functions/stpt-vehicles"
  status = 200

[[redirects]]
  from = "/api/velo-stations"
  to = "/.netlify/functions/velo-stations"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
